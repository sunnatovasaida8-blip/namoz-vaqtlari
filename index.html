<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Namoz Vaqtlari</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: #121921;
            color: #ffffff;
            padding: 16px;
            text-align: center;
        }

        .container {
            max-width: 420px;
            margin: 0 auto;
        }

        h1 {
            font-size: 26px;
            margin-bottom: 6px;
            color: #64b5ef;
        }

        .subtitle {
            font-size: 14px;
            color: #a2b5c7;
            margin-bottom: 16px;
        }

        .date-card {
            background: #1c2733;
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 16px;
            font-size: 16px;
            color: #31b545;
            font-weight: bold;
        }

        .times-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .time-card {
            background: #232e3c;
            padding: 16px 20px;
            border-radius: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 20px;
            font-weight: 600;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .time-card.active {
            border: 2px solid #31b545;
            background: rgba(49, 181, 69, 0.2);
        }

        .time-val {
            font-size: 22px;
            font-weight: bold;
            color: #64b5ef;
        }

        .time-card.active .time-val {
            color: #31b545;
        }

        .btn-test {
            margin-top: 20px;
            width: 100%;
            padding: 16px;
            border-radius: 12px;
            border: none;
            background-color: #2481cc;
            color: #ffffff;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }

        .status-box {
            margin-top: 14px;
            padding: 10px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            font-size: 13px;
            color: #8fadc9;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🕌 Namoz Vaqtlari</h1>
    <div class="subtitle">Otangiz uchun 5 vaqt namoz eslatmasi</div>

    <div class="date-card" id="current-date">Bugungi sana yuklanmoqda...</div>

    <div class="times-list" id="times-container">
        <!-- Namoz vaqtlari bu yerda ko'rinadi -->
    </div>

    <button class="btn-test" onclick="testSignal()">🔔 Signalni tekshirib ko'rish</button>
    <div class="status-box" id="status">Signal holati: Avtomatik eslatma yoqilgan</div>
</div>

<script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    const CITY = "Tashkent";
    const COUNTRY = "Uzbekistan";

    let prayerTimes = {};
    let alertedTimes = new Set();

    // Namoz vaqti kirganda beriladigan maxsus va baland signal (Audio Beep)
    function playAlarmSignal() {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        let count = 0;
        const interval = setInterval(() => {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            osc.type = "sine";
            osc.frequency.setValueAtTime(659.25, audioCtx.currentTime); // E5 bobi
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);

            osc.connect(gain);
            gain.connect(audioCtx.destination);

            osc.start();
            osc.stop(audioCtx.currentTime + 0.4);

            count++;
            if (count >= 5) {
                clearInterval(interval);
            }
        }, 600);
    }

    function testSignal() {
        playAlarmSignal();
        document.getElementById('status').innerText = "Signal ovozi va tebranish tekshirildi!";
        if (tg.HapticFeedback) {
            tg.HapticFeedback.notificationOccurred('success');
        }
    }

    async function fetchPrayerTimes() {
        try {
            const response = await fetch(`https://api.aladhan.com/v1/timingsByCity?city=${CITY}&country=${COUNTRY}&method=3`);
            const data = await response.json();
            
            const timings = data.data.timings;
            const dateHijri = data.data.date.hijri;
            
            document.getElementById('current-date').innerText = `Bugun: ${data.data.date.readable} (${dateHijri.day} ${dateHijri.month.en})`;

            prayerTimes = {
                "Bamdod": timings.Fajr,
                "Peshin": timings.Dhuhr,
                "Asr": timings.Asr,
                "Shom": timings.Maghrib,
                "Xufton": timings.Isha
            };

            renderTimes();
        } catch (error) {
            document.getElementById('status').innerText = "Vaqtlarni yuklashda xatolik bo'ldi. Internetni tekshiring.";
        }
    }

    function renderTimes() {
        const container = document.getElementById('times-container');
        container.innerHTML = '';

        const now = new Date();
        const currentTime = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;

        for (const [name, time] of Object.entries(prayerTimes)) {
            const card = document.createElement('div');
            card.className = 'time-card';
            if (currentTime === time) {
                card.classList.add('active');
            }
            card.innerHTML = `<span>${name}</span> <span class="time-val">${time}</span>`;
            container.appendChild(card);
        }
    }

    // Har 10 soniyada namoz vaqti kelganini tekshirib turadi
    setInterval(() => {
        const now = new Date();
        const currentTime = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;

        for (const [name, time] of Object.entries(prayerTimes)) {
            if (currentTime === time && !alertedTimes.has(name)) {
                playAlarmSignal();
                alertedTimes.add(name);
                document.getElementById('status').innerText = `🔔 ${name} namozi vaqti kirdi!`;
                if (tg.HapticFeedback) {
                    tg.HapticFeedback.notificationOccurred('warning');
                }
            }
        }
        renderTimes();
    }, 10000);

    fetchPrayerTimes();
</script>

</body>
</html>
